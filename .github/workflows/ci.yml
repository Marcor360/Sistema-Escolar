name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: node ../scripts/ci-install.cjs
      - run: npm audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node ../scripts/ci-install.cjs
      - run: npm audit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: node ../scripts/ci-install.cjs
      - name: Revisión de vulnerabilidades npm
        run: node ../scripts/check-mobile-audit.cjs
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx expo export --platform android --output-dir .expo/export

  integration-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-root
          MYSQL_DATABASE: escolar_integration_mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-root"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      RUN_DB_INTEGRATION: '1'
      NODE_ENV: test
      DB_TYPE: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASS: integration-root
      DB_NAME: escolar_integration_mysql
      DB_SYNC: 'false'
      JWT_SECRET: integration-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: node ../scripts/ci-install.cjs
      - run: npm run test:integration

  integration-sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Integration_Test_42!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Integration_Test_42!' -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=20 --health-start-period=30s
    defaults:
      run:
        working-directory: backend
    env:
      RUN_DB_INTEGRATION: '1'
      NODE_ENV: test
      DB_TYPE: mssql
      DB_HOST: 127.0.0.1
      DB_PORT: '1433'
      DB_USER: sa
      DB_PASS: Integration_Test_42!
      DB_NAME: escolar_integration_sqlserver
      DB_SYNC: 'false'
      DB_ENCRYPT: 'false'
      DB_TRUST_SERVER_CERTIFICATE: 'true'
      JWT_SECRET: integration-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: node ../scripts/ci-install.cjs
      - run: npm run test:integration

  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s etl/tests -v

  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parsear scripts PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($error in $errors) { Write-Error "$($_.Name): $error"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Validar estructura de despliegue
        shell: pwsh
        run: ./scripts/windows/Test-StagingScripts.ps1
