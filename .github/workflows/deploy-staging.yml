name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión opcional; se deriva del commit y se rechaza si no coincide
        required: false
        type: string
      target:
        description: Componente que se va a actualizar
        required: true
        default: Todo
        type: choice
        options: [Todo, Sistema, PortalAlumno]
      commit_sha:
        description: SHA completo en main con CI aprobado
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, staging]
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Comprobar habilitación, commit y CI
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DEPLOY_ENABLED -ne 'true') { throw 'STAGING_DEPLOY_ENABLED debe ser true en el entorno staging.' }
          $sourceVersion = (Get-Content backend/package.json -Raw | ConvertFrom-Json).version
          if ($sourceVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Versión del commit inválida.' }
          if ($env:VERSION -and $env:VERSION -ne $sourceVersion) { throw 'La versión solicitada no coincide con el commit.' }
          if ($env:COMMIT_SHA -notmatch '^[a-fA-F0-9]{40}$') { throw 'Usa el SHA completo del commit.' }
          git fetch origin main
          git merge-base --is-ancestor $env:COMMIT_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'El commit no pertenece a main.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:COMMIT_SHA&per_page=30"
          $runs = (Invoke-RestMethod -Uri $uri -Headers $headers).workflow_runs
          if (-not @($runs | Where-Object { $_.head_branch -eq 'main' -and $_.event -eq 'push' -and $_.conclusion -eq 'success' }).Count) { throw 'No hay CI aprobado para este commit en main.' }
      - name: Actualizar sistema y Portal Alumno según el componente elegido
        shell: powershell
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_TARGET: ${{ inputs.target }}
          SETTINGS_PATH: ${{ vars.STAGING_DEPLOY_SETTINGS_PATH }}
        run: |
          $ErrorActionPreference = 'Stop'
          $settings = if ($env:SETTINGS_PATH) { $env:SETTINGS_PATH } else { 'C:\SistemaEscolar\config\deploy-staging.json' }
          & .\scripts\windows\Update-Staging.ps1 -Source $PWD.Path -SettingsPath $settings -Target $env:DEPLOY_TARGET -Version $env:VERSION
