# Infraestructura local de desarrollo. Configura credenciales en .env.
# MySQL por defecto:            docker compose up -d mysql
# SQL Server (perfil opcional): docker compose --profile mssql up -d sqlserver
services:
  mysql:
    image: mysql:8.4
    container_name: escolar-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-escolar}
      MYSQL_USER: ${MYSQL_USER:-escolar}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: escolar-sqlserver
    profiles: ["mssql"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Define SQLSERVER_SA_PASSWORD en .env}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mysql_data:
  mssql_data:
